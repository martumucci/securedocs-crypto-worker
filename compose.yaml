services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: securedocs
      RABBITMQ_DEFAULT_PASS: securedocs
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  worker:
    build:
      context: .
      dockerfile: dockerfile
    environment:
      REDIS__URL: redis://redis:6379
      RABBITMQ__URL: amqp://securedocs:securedocs@rabbitmq:5672/
      KEYS__PRIVATE_KEY_PATH: /app/keys/ed25519.private
      KEYS__PUBLIC_KEY_PATH: /app/keys/ed25519.public
      HEALTHCHECK__PORT: "8080"
    volumes:
      - ./keys:/app/keys
    ports:
      - "8080:8080"
    depends_on:
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health').read()"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
