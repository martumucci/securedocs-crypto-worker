[project]
name = "securedocs-crypto-worker"
version = "0.1.0"
description = "Worker that encrypts and signs documents submitted to SecureDocs."
requires-python = ">=3.12"
dependencies = [
    "pika>=1.3.2",
    "redis>=5.0.8",
    # Capped <47: the 47+ aarch64 wheel SIGILLs under Docker Desktop on
    # Apple Silicon. Do not raise without re-verifying in the container.
    "cryptography>=43.0.1,<47",
    "pydantic>=2.9.2",
    "pydantic-settings>=2.5.2",
    "structlog>=24.4.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.3",
    "pytest-cov>=5.0.0",
    "testcontainers[redis,rabbitmq]>=4.8.1",
    "ruff>=0.6.9",
    "mypy>=1.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/securedocs_worker"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --strict-markers"
markers = [
    "integration: integration tests (require Docker)",
]
